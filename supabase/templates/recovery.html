<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #241b1b;">
  <p style="font-size: 20px; font-weight: bold; color: #7b3048; margin: 0 0 16px;">MYSTOREY</p>
  <h2 style="margin: 0 0 12px;">Mot de passe oublié ?</h2>
  <p style="line-height: 1.5;">Touchez le bouton ci-dessous pour choisir un nouveau mot de passe.</p>
  <p style="margin: 24px 0;">
    <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery" style="display: inline-block; padding: 12px 20px; border-radius: 10px; background: #7b3048; color: #ffffff; text-decoration: none; font-weight: bold;">Choisir un nouveau mot de passe</a>
  </p>
  <p style="line-height: 1.5; color: #806f68; font-size: 13px;">Vous n’avez rien demandé ? Ignorez cet email : votre mot de passe ne change pas.</p>
</div>
