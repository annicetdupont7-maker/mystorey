# Hosted auth settings for the MYSTOREY project, applied with `npx supabase config push`.
#
# Deliberately minimal: `config push` only changes what this file declares and leaves
# every other hosted setting (MFA, SMS, pooler, storage…) exactly as it is. Always run
# `npx supabase config diff` first.

project_id = "oklkkesfzkqsyimdljxm"

[auth]
# Links in auth emails fall back to this address. It was http://localhost:3000, so the
# password-reset link sent to real sellers pointed at a page that does not exist.
site_url = "https://mystorey.vercel.app"
additional_redirect_urls = [
  "https://mystorey.vercel.app/**",
  "https://mystorey-tau.vercel.app/**",
  "http://localhost:3000/**",
]

# Emails go through Brevo (free transactional SMTP): host smtp-relay.brevo.com,
# port 587, user ba9513001@smtp-brevo.com. The SMTP block is managed in the Supabase
# dashboard because the CLI would require the key in this file — it never goes here.

[auth.rate_limit]
email_sent = 100

# French templates with token_hash links, verified by /auth/callback: unlike the
# default PKCE link they still work when the email is opened in another app or phone.
[auth.email.template.confirmation]
subject = "Confirmez votre compte MYSTOREY"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Choisissez un nouveau mot de passe MYSTOREY"
content_path = "./supabase/templates/recovery.html"
